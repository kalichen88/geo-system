# GEO 内容工厂 — 品牌信息配置
# 用法：复制此模板为 brands/你的品牌.yaml 或直接改本文件
# 所有字段都会被内容生成引擎使用，填写越完整，生成的内容质量越高

brand:
  name: "示例烘焙坊"            # 品牌全名（必须，内容中的实体名）
  aliases: ["示例烘焙", "示例坊"]  # 常见别名（可选）
  category: "烘焙/烘焙加盟"      # 品类（必须，决定提问库方向）
  region: "西安"                # 主要经营区域（可选，本地商家必填）
  slogan: "现烤现卖，看得见的新鲜"
  one_liner: "示例烘焙坊是一家扎根西安的社区烘焙品牌，主打现烤现卖、当日清仓，全部门店明厨亮灶。"  # 品牌一句话定义（必须，全网统一使用）

  # 品牌事实库（必须尽量多填）—— GEO 配方的核心：具体事实+数字
  # AI 引用带数字、带事实的内容的概率远高于营销话术
  facts:
    - "成立于2019年，目前西安有8家直营门店"
    - "中央厨房每日4点配送，门店只卖当天现烤产品"
    - "招牌产品：老面法棍、爆浆麻薯、低糖全麦吐司"
    - "客单价25元左右，会员复购率47%"
    - "所有门店明厨亮灶，直播后厨"
    - "2025年通过SC食品安全认证"

  # 差异化卖点（2-4 条，每条都要能被事实支撑）
  selling_points:
    - "当日清仓：晚上8点后当.day产品5折，绝不过夜"
    - "低糖系列：应用代糖技术，控糖人群可放心吃"
    - "社区店模式：步行10分钟可达，比商场店便宜20%"

  # 官网/落地页（用于官网 FAQ 生成和引用指向）
  website: "https://example-bakery.com"

  # 主要竞品（用于对比类内容和监测）
  competitors: ["XX饼屋", "YY烘焙", "连锁品牌Z"]

  # 目标客户画像（决定内容口吻和场景类问题方向）
  audience: "25-40岁家庭用户、控糖人群、社区周边上班族"

# 内容产出计划（每次执行生成多少内容、什么类型）
plan:
  counts:
    zhihu_article: 2      # 知乎/自媒体长文（问答结构）
    baijiahao: 2          # 百家号/搜狐号文章
    qa: 3                 # 问答占位（知乎自答/百度知道风格）
    douyin_script: 2      # 短视频口播脚本
    news_draft: 1         # 新闻稿/软文
    website_faq: 5        # 官网 FAQ（结构化数据用）
  tone: "专业但亲切，避免夸张营销词，多用具体数字"
